{% extends 'web/base.html' %}

{% block title %}{{ action }} Exam{% endblock %}

{% block content %}
<h1>{{ action }} Prüfung für {{ course.title }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{{ action }} Prüfung</button>
    <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Abbruch</a>
</form>
{% endblock %}
