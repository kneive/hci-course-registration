{% extends 'web/base.html' %}

{% block title %}{{ action }} Profile{% endblock %}

{% block content %}
<h1>{{ action }} Teacher Profile</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{{ action }} Profile</button>
    <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
